<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit – Browsing portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="nav">
    <button class="ic" id="back" aria-label="Back" title="Back">←</button>
    <button class="ic" id="fwd" aria-label="Forward" title="Forward">→</button>
    <button class="ic" id="reload" aria-label="Reload" title="Reload">⟳</button>
    <button class="ic" id="home-btn" aria-label="Start page" title="Start page">⌂</button>
  </div>
  <form id="form" class="omni" autocomplete="off">
    <input id="url" type="text" inputmode="url" spellcheck="false" placeholder="Search or enter a site address" aria-label="Address bar">
    <button type="button" class="ic star" id="star" aria-label="Bookmark this page" title="Bookmark this page">☆</button>
  </form>
  <div class="nav">
    <button class="ic" id="ext" aria-label="Open in new tab" title="Open in new tab">↗</button>
    <button class="ic" id="theme" aria-label="Switch theme" title="Switch theme">◐</button>
    <button class="ic" id="menu" aria-label="Bookmarks and history" title="Bookmarks and history">☰</button>
  </div>
  <div id="load" class="load" hidden></div>
</header>

<main class="stage">
  <section id="home" class="view home">
    <h1>Where to?</h1>
    <p>Search the web or type a site address.</p>
    <form id="home-form" class="hero-search"><input id="home-q" type="text" placeholder="Search or enter a site address" aria-label="Search"><button class="go">Go</button></form>
    <div id="grid" class="grid"></div>
  </section>

  <iframe id="frame" class="view" title="Page" hidden
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
    referrerpolicy="no-referrer"></iframe>

  <section id="notice" class="view notice" hidden>
    <div class="card">
      <h2 id="nt"></h2>
      <p id="nm"></p>
      <div class="row-btns">
        <button class="go" id="n-open">Open in new tab</button>
        <button class="ghost" id="n-home">Back to start</button>
      </div>
    </div>
  </section>

  <div id="hint" class="hint" hidden>
    <span>Page blank or blocked? Some sites don’t allow embedding.</span>
    <button id="h-open">Open in new tab</button>
    <button id="h-close" aria-label="Dismiss">✕</button>
  </div>
</main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="tabs">
    <button id="t-bm" class="on">Bookmarks</button>
    <button id="t-hist">History</button>
    <button class="ic" id="d-close" aria-label="Close panel">✕</button>
  </div>
  <ul id="list"></ul>
  <button id="clear" class="ghost clear" hidden>Clear history</button>
</aside>
<div id="scrim" class="scrim" hidden></div>
<script src="app.js"></script>
</body>
</html>
